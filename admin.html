<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Grand Crown Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#111827;font-family:Arial,Helvetica,sans-serif}.shell{min-height:100vh}.top{background:#fff;border-bottom:1px solid #d8dee8;padding:24px 28px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.brand{font-size:27px;font-weight:800;line-height:1.05;min-width:170px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.select,.pill{height:54px;border:1px solid #d8dee8;border-radius:15px;background:#fff;padding:0 18px;font-size:20px}.select{min-width:180px}.pill{display:flex;align-items:center;gap:10px;font-weight:700}.live-dot{width:14px;height:14px;border-radius:50%;background:#16a16a;display:inline-block}.nav{background:#fff;border-bottom:1px solid #d8dee8;padding:14px 28px 24px;display:grid;grid-template-columns:repeat(4,max-content);gap:18px 42px;align-items:center}.nav button{border:0;background:none;color:#617083;font-size:21px;font-weight:700;padding:10px 16px;border-radius:28px;cursor:pointer}.nav button.active{background:#f47b08;color:#fff}.main{padding:38px 0 60px}.main h2{font-size:27px;margin:0 0 26px;padding:0 0 0 0}.content{padding:0 28px}.overview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.stat{background:#fff;border:1px solid #d7dee8;border-radius:24px;padding:28px 27px;min-height:128px;box-shadow:0 1px 2px rgba(0,0,0,.02)}.stat .value{font-size:33px;font-weight:800;line-height:1.12;margin-bottom:8px}.stat .label{font-size:21px;color:#697687}.panel{background:#fff;border:1px solid #d7dee8;border-radius:24px;padding:24px;margin-top:20px}.panel h3{margin:0 0 18px;font-size:24px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.btn{border:1px solid #d1d8e2;background:#fff;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;font-size:16px}.btn.primary{background:#f47b08;color:#fff;border-color:#f47b08}.btn.danger{background:#fff0f0;color:#c62828;border-color:#f3b5b5}.btn.success{background:#e9f8f0;color:#087443;border-color:#b9e6cd}.row{padding:15px 0;border-bottom:1px solid #e5e9ef}.row:last-child{border-bottom:0}table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e5e9ef}th{color:#697687}.empty{color:#697687;padding:20px 0}.form{display:grid;gap:12px}.form input{width:100%;padding:14px;border:1px solid #d5dce6;border-radius:12px;font-size:16px}.hide{display:none}.login-wrap{max-width:480px;margin:80px auto;padding:24px}.login-card{background:#fff;border:1px solid #d7dee8;border-radius:24px;padding:30px}.login-card h1{margin-top:0}.muted{color:#697687}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:13px 16px;border-radius:12px;display:none;z-index:9}@media(max-width:700px){.top{padding:18px 24px 12px;gap:14px}.brand{font-size:26px}.controls{width:100%;justify-content:flex-start}.select{min-width:180px}.nav{padding:14px 28px 24px;grid-template-columns:repeat(4,max-content);gap:16px 28px;overflow:hidden}.nav button{font-size:20px;padding:8px 16px}.content{padding:0}.main h2{padding-left:0}.overview{gap:20px}.stat{border-radius:24px;padding:28px 27px;min-height:128px}.stat .value{font-size:32px}.stat .label{font-size:20px}.main{padding:38px 0}.panel{border-radius:22px;margin:18px 0}.top+.nav{border-bottom:1px solid #d8dee8}}
</style></head>
<body>
<div id="loginView" class="login-wrap"><div class="login-card"><h1>Grand Crown Admin</h1><p class="muted">Administrator sign in</p><div class="form"><input id="au" value="admin" placeholder="Username"><input id="ap" type="password" placeholder="Password"><button class="btn primary" onclick="login()">Log in</button><div id="lm" class="muted"></div></div></div></div>
<div id="app" class="shell hide">
<header class="top"><div class="brand">Grand Crown<br>Admin</div><div class="controls"><button class="select" onclick="toast('Menu ready')">⌄</button><select class="select" id="lang"><option>English</option></select><div class="pill"><span class="live-dot"></span>Live</div><button class="pill" onclick="toast('Notifications refreshed')">Notify</button><button class="pill" onclick="location.reload()">Refresh</button><button class="pill" onclick="logout()">Log out</button></div></header>
<nav class="nav" id="nav"></nav>
<main class="main"><div class="content"><h2 id="title">Overview</h2><div id="page"></div></div></main></div><div id="toast" class="toast"></div>
<script>
const tabs=['Dashboard','Analytics','Users','Deposits','Withdrawals','Products','Gift Codes','Messages','Transactions','Referrals','Settings','Countries','Admins','Activity Log'];
const $=id=>document.getElementById(id);
async function api(u,o={}){const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw d;return d}
function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
async function login(){try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('au').value,password:$('ap').value})});$('loginView').classList.add('hide');$('app').classList.remove('hide');buildNav();openTab('Dashboard')}catch(e){$('lm').textContent=e.error||'Login failed'}}
async function logout(){await api('/api/admin/logout',{method:'POST'});location.reload()}
function buildNav(){$('nav').innerHTML=tabs.map(x=>`<button data-tab="${x}" onclick="openTab('${x}')">${x}</button>`).join('')}
function setActive(tab){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
async function openTab(tab){setActive(tab);$('title').textContent=tab==='Dashboard'?'Overview':tab;$('page').innerHTML='<div class="panel">Loading…</div>';try{
if(tab==='Dashboard')return dashboard();if(tab==='Analytics')return analytics();if(tab==='Users')return users();if(tab==='Deposits')return deposits();if(tab==='Withdrawals')return withdrawals();if(tab==='Products')return products();if(tab==='Gift Codes')return simple('Gift Codes','Gift-code management is ready for integration.');if(tab==='Messages')return simple('Messages','Customer messages and support notices.');if(tab==='Transactions')return transactions();if(tab==='Referrals')return referrals();if(tab==='Settings')return settings();if(tab==='Countries')return simple('Countries','Country statistics and availability.');if(tab==='Admins')return simple('Admins','Administrator management.');if(tab==='Activity Log')return activity();}catch(e){$('page').innerHTML=`<div class="panel">${e.error||'Unable to load this section'}</div>`}}
function stat(v,l){return `<div class="stat"><div class="value">${v}</div><div class="label">${l}</div></div>`}
async function dashboard(){const d=await api('/api/admin/dashboard');$('page').innerHTML=`<div class="overview">${stat(d.users,'Total users')}${stat(d.users,'Active users')}${stat(0,'Banned users')}${stat('UGX '+money(d.walletBalances),'Wallet balances')}${stat('UGX '+money(d.totalDeposited),'Total deposited')}${stat('UGX '+money(d.totalWithdrawn),'Total withdrawn')}${stat('UGX '+money(d.totalInvested),'Total invested')}${stat(d.products,'Active plans')}${stat(d.payments,'Pending deposits')}${stat(d.withdrawals,'Pending withdrawals')}</div>`}
function money(n){return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2})}
async function analytics(){const d=await api('/api/admin/dashboard');$('page').innerHTML=`<div class="overview">${stat(d.transactions,'Transactions')}${stat(d.purchases,'Purchases')}${stat('UGX '+money(d.totalDeposited),'Deposited')}${stat('UGX '+money(d.totalWithdrawn),'Withdrawn')}</div><div class="panel"><h3>Platform activity</h3><p class="muted">Live figures are calculated from current Grand Crown records.</p></div>`}
async function users(){const a=await api('/api/admin/users');$('page').innerHTML=`<div class="panel"><h3>Users</h3><table><tr><th>Phone</th><th>ID</th><th>Referral</th><th>Wallet</th></tr>${a.map(x=>`<tr><td>${x.phone}</td><td>${x.id}</td><td>${x.referralCode}</td><td>UGX ${money(x.wallet)}</td></tr>`).join('')||'<tr><td colspan="4">No users</td></tr>'}</table></div>`}
async function deposits(){const a=await api('/api/admin/payments');$('page').innerHTML=`<div class="panel"><h3>Deposits</h3>${a.length?a.map(x=>`<div class="row"><b>${x.productName}</b><br>User: ${x.userId} · UGX ${money(x.amount)} · ${x.method}<br>Payer: ${x.payerPhone} · Tx: <b>${x.transactionId}</b><br>Status: <b>${x.status}</b>${x.status==='pending'?`<div class="toolbar"><button class="btn success" onclick="reviewPay('${x.id}','approve')">Approve</button><button class="btn danger" onclick="reviewPay('${x.id}','reject')">Reject</button></div>`:''}</div>`).join(''):'<div class="empty">No deposits</div>'}</div>`}
async function reviewPay(id,action){await api('/api/admin/payments/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});toast('Deposit '+action+'d');openTab('Deposits')}
async function withdrawals(){const a=await api('/api/admin/withdrawals');$('page').innerHTML=`<div class="panel"><h3>Withdrawals</h3>${a.length?a.map(x=>`<div class="row"><b>${x.id}</b><br>User: ${x.userId}<br>Amount: UGX ${money(x.amount)} · Fee: UGX ${money(x.fee)} · Net: UGX ${money(x.netAmount)}<br>${x.method} · ${x.phone}<br>Status: <b>${x.status}</b>${x.status==='pending'?`<div class="toolbar"><button class="btn success" onclick="reviewWd('${x.id}','approve')">Mark paid</button><button class="btn danger" onclick="reviewWd('${x.id}','reject')">Reject</button></div>`:''}</div>`).join(''):'<div class="empty">No withdrawals</div>'}</div>`}
async function reviewWd(id,action){await api('/api/admin/withdrawals/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});toast('Withdrawal '+action+'d');openTab('Withdrawals')}
async function products(){const a=await api('/api/admin/products');$('page').innerHTML=`<div class="panel"><h3>Products</h3><div class="toolbar"><button class="btn primary" onclick="addProduct()">Add product</button></div><table><tr><th>Name</th><th>Investment</th><th>Daily</th><th>Total</th><th>Days</th><th></th></tr>${a.map(x=>`<tr><td>${x.name}</td><td>UGX ${money(x.price)}</td><td>UGX ${money(x.daily)}</td><td>UGX ${money(x.total)}</td><td>${x.days}</td><td><button class="btn danger" onclick="delProduct('${x.id}')">Delete</button></td></tr>`).join('')}</table></div>`}
async function addProduct(){const name=prompt('Product name');if(!name)return;const price=Number(prompt('Investment'));const daily=Number(prompt('Daily earning'));const total=Number(prompt('Total earning'));const days=Number(prompt('Validity days','90'));await api('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,price,daily,total,days})});openTab('Products')}
async function delProduct(id){if(!confirm('Delete product?'))return;await api('/api/admin/products/'+id,{method:'DELETE'});openTab('Products')}
async function transactions(){const a=await api('/api/admin/transactions');$('page').innerHTML=`<div class="panel"><h3>Transactions</h3><table><tr><th>Type</th><th>User</th><th>Amount</th><th>Date</th></tr>${a.map(x=>`<tr><td>${x.type}</td><td>${x.userId}</td><td>UGX ${money(x.amount)}</td><td>${new Date(x.createdAt).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="4">No transactions</td></tr>'}</table></div>`}
async function referrals(){const a=await api('/api/admin/referrals');$('page').innerHTML=`<div class="panel"><h3>Referrals</h3><p>Referral commissions: ${a.commissions} records</p><p>Total referral paid: UGX ${money(a.total)}</p></div>`}
async function settings(){const s=await api('/api/admin/settings');$('page').innerHTML=`<div class="panel"><h3>Settings</h3><div class="form"><input id="brand" value="${s.brand||'Grand Crown'}" placeholder="Brand"><button class="btn primary" onclick="saveSettings()">Save settings</button></div></div>`}
async function saveSettings(){await api('/api/admin/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand:$('brand').value})});toast('Settings saved')}
async function activity(){const a=await api('/api/admin/activity');$('page').innerHTML=`<div class="panel"><h3>Activity Log</h3>${a.length?a.map(x=>`<div class="row">${x.type||'activity'} · ${x.userId||''}<br><span class="muted">${new Date(x.createdAt).toLocaleString()}</span></div>`).join(''):'<div class="empty">No activity</div>'}</div>`}
function simple(h,t){$('page').innerHTML=`<div class="panel"><h3>${h}</h3><p class="muted">${t}</p></div>`}
</script></body></html>
